# Deploys the site to GitHub Pages at https://171801rohith.github.io/MyPortfolio_Rohith171801/
#
# One-time setup: repo Settings → Pages → Build and deployment → Source: "GitHub Actions".
# It runs manually (Actions tab → "Deploy to GitHub Pages" → Run workflow).
# To deploy on every push to main as well, uncomment the `push` trigger below.
name: Deploy to GitHub Pages

on:
  workflow_dispatch:
  # push:
  #   branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Builds with base "/MyPortfolio_Rohith171801/" (see vite.config.ts).
      - run: npm run build:gh-pages
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
